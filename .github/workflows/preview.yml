name: preview

# Deploys a review site for the transcribed pages a pull request changes, to a Cloudflare Workers
# Preview named pr-<number>, and links it from the PR. Deleted again when the PR closes.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.149.0
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Secrets are not available to pull requests from forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: build
        name: Build the review site
        run: |
          chunks="$(python tools/preview_site.py --base "origin/${{ github.base_ref }}")"
          echo "chunks=$(echo $chunks)" >> "$GITHUB_OUTPUT"
      - id: preview
        name: Create or update the Preview
        if: steps.build.outputs.chunks != ''
        run: |
          set -o pipefail
          output="$(npx --yes "$WRANGLER" preview --name "$PREVIEW_NAME" --message "${{ github.event.pull_request.head.sha }}" --json)"
          echo "preview_url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview link
        if: steps.build.outputs.chunks != ''
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Review preview (${{ steps.build.outputs.chunks }}): ${{ steps.preview.outputs.preview_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails harmlessly for a PR that never had a preview.
      - run: npx --yes "$WRANGLER" preview delete --name "$PREVIEW_NAME" --skip-confirmation
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
