name: validate

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # validate.py needs only the standard library and the vendored abc2xml.
      - run: python tools/validate.py
